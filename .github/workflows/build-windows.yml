name: Build MingCam Windows (Portable)

on:
  push:
    branches: [ main ]
    paths:
      - 'Windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained Portable Folder (win-x64)
        shell: pwsh
        run: |
          dotnet publish Windows/MingCam.Windows/MingCam.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/MingCam-Windows-x64

      - name: Compress Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MingCam-Windows-x64/* -DestinationPath MingCam-Windows-x64-Portable.zip -Force

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MingCam-Windows-x64-Portable
          path: MingCam-Windows-x64-Portable.zip
          retention-days: 30

      - name: Publish ZIP to GitHub Release v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseExists = $true
          try {
            gh release view v1.0.0 | Out-Null
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release upload v1.0.0 MingCam-Windows-x64-Portable.zip --clobber
          } else {
            gh release create v1.0.0 MingCam-Windows-x64-Portable.zip `
              --title "MingCam v1.0.0 — macOS 原生版 & Windows 綠色免安裝版" `
              --notes "MingCam Windows v1.0 綠色免安裝版（免安裝、免系統管理員、已內包 .NET 8，解壓後直接點兩下 MingCam.exe 即可使用）。"
          }
